
<!DOCTYPE html>
<html lang="es-AR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quela Home | Blanquería y productos para el hogar</title>

    <meta
        name="description"
        content="Conocé Quela Home. Sábanas, cubrecamas, toallas y productos de blanquería para tu hogar. Visitá nuestra tienda online."

    <link rel="icon"

          href="assets/images/favicon.png">

    <link rel="stylesheet" href="css/styles.css">

<body>

    <main class="landing">

        <!-- Presentación de la marca -->
        <header class="landing__header">

            <img

                width="120"

            <h1 class="landing__title">

            <p class="landing__description">

        <!-- Imagen de presentación -->

                class="landing__image"

        <!-- Accesos a nuestros canales -->
        <nav class="landing__links" aria-label="Nuestros canales oficiales">

                Encontranos en

            <a

                href="https://tiendaquela.mitiendanube.com/"

            </a>

            <a
                class="link-button"
                href="https://wa.me/5491155867306"
                target="_blank"
                rel="noopener noreferrer"

            </a>

            <a
                class="link-button"
                href="https://www.instagram.com/tiendaquela.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Instagram</span>
            </a>

            <a
                class="link-button"
                href="https://www.facebook.com/tiendaquela.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Facebook</span>
            </a>

            <a
                class="link-button"
                href="https://www.tiktok.com/@tiendaquela.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>TikTok</span>
            </a>
