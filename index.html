<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quela Home | Próximamente</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F7F4EE; color: #46555C; font-family: Arial, sans-serif; }
    main { text-align: center; max-width: 520px; }
    .logo { width: 86px; height: 86px; border-radius: 50%; background: #46555C; color: #F7F4EE; display: grid; place-items: center; font-size: 52px; margin: 0 auto 22px; }
    h1 { font-size: clamp(32px, 6vw, 46px); margin: 0 0 16px; }
    p { font-size: 18px; line-height: 1.5; }
    .pill { display: inline-block; margin-top: 14px; background: #46555C; color: white; padding: 13px 24px; border-radius: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Quela">Q</div>
    <h1>Quela Home</h1>
    <p>¡Bienvenidos a nuestra tienda!</p>
    <p>Estamos preparando algo especial para vos.</p>
    <div class="pill">Próximamente</div>
  </main>
</body>
</html>
